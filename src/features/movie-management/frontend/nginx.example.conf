# movie-management フロントの配置例。
# 公開 URL は /portal_movie_management/ 。Vite base も同じ。
# dist の中身はドキュメントルートの features/movie-management/ に置く。
#
#   ドキュメントルート/features/movie-management/index.html
#   ドキュメントルート/features/movie-management/assets/...
#
# rewrite は last（break ではない）。

server {
    listen 80;
    server_name example.com;

    root /var/www/html;

    location = /portal_movie_management {
        return 301 /portal_movie_management/;
    }

    location /portal_movie_management/ {
        rewrite ^/portal_movie_management/(.*)$ /features/movie-management/$1 last;
    }

    location /features/movie-management/ {
        internal;
        try_files $uri /features/movie-management/index.html;
    }

    # API を同一オリジンにする場合。使わないならこの location は不要。
    # フロントの VITE_API_MOVIE_MANAGEMENT_URL は https://example.com/portal-movie-management-api にする。
    #
    # 動画・サムネイルの取得は、動画要素・画像要素が Cookie を自動で送る。フロントと API は、
    # Cookie が送られる関係（同一サイト）にすること。
    location /portal-movie-management-api/ {
        proxy_pass http://127.0.0.1:8007/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 動画のチャンクのアップロード（1 リクエストが約 4 MB、上限は 8 MiB）を通すため、
        # 本文の上限を 8 MB 以上にする。
        client_max_body_size 10m;

        # 動画の配信は、応答をバッファリングせずに流す（Range 要求はそのまま渡る）。
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
