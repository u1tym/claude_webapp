# schedule フロントの配置例。
# 公開 URL は /portal_schedule/ 。Vite base も同じ。
# dist の中身はドキュメントルートの features/schedule/ に置く。
#
#   ドキュメントルート/features/schedule/index.html
#   ドキュメントルート/features/schedule/assets/...
#
# rewrite は last（break ではない）。

server {
    listen 80;
    server_name example.com;

    root /var/www/html;

    location = /portal_schedule {
        return 301 /portal_schedule/;
    }

    location /portal_schedule/ {
        rewrite ^/portal_schedule/(.*)$ /features/schedule/$1 last;
    }

    location /features/schedule/ {
        internal;
        try_files $uri /features/schedule/index.html;
    }

    # API を同一オリジンにする場合。使わないならこの location は不要。
    # フロントの VITE_API_SCHEDULE_URL は https://example.com/portal-schedule-api にする。
    location /portal-schedule-api/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
