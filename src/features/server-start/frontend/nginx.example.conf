# server-start フロントの配置例。
# 公開 URL は /portal_server_start/ 。Vite base も同じ。
# dist の中身はドキュメントルートの features/server-start/ に置く。
#
#   ドキュメントルート/features/server-start/index.html
#   ドキュメントルート/features/server-start/assets/...
#
# rewrite は last（break ではない）。

server {
    listen 80;
    server_name example.com;

    root /var/www/html;

    location = /portal_server_start {
        return 301 /portal_server_start/;
    }

    location /portal_server_start/ {
        rewrite ^/portal_server_start/(.*)$ /features/server-start/$1 last;
    }

    location /features/server-start/ {
        internal;
        try_files $uri /features/server-start/index.html;
    }

    # API を同一オリジンにする場合。使わないならこの location は不要。
    # フロントの VITE_API_SERVER_START_URL は https://example.com/portal-server-start-api にする。
    location /portal-server-start-api/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
