# contract-management フロントの配置例（rules/17-nginx-deploy.md）。
# 公開 URL は /portal_contract_management/ 。Vite base も同じ。
# dist の中身はドキュメントルートの features/contract-management/ に置く。
#
#   ドキュメントルート/features/contract-management/index.html
#   ドキュメントルート/features/contract-management/assets/...
#
# rewrite は last（break ではない）。break と try_files を同じ location に置かない
# （JS/CSS が HTML になる）。$uri/ は使わない。
#
# 注意: スラッシュなしの /portal_contract_management への 301 は、クエリを引き継がない。
# ポータルのメニューが付けるキャッシュ回避のクエリ（?a=…）は、遷移先の URL が
# 末尾スラッシュなしだと消える。機能マスタの遷移先 URL は、末尾に / を付けた
# 公開 URL（例: https://<ホスト>/portal_contract_management/）にする。

server {
    listen 80;
    server_name example.com;

    root /var/www/html;

    location = /portal_contract_management {
        return 301 /portal_contract_management/;
    }

    location /portal_contract_management/ {
        rewrite ^/portal_contract_management/(.*)$ /features/contract-management/$1 last;
    }

    # 画面（/portal_contract_management/contracts など）を直接開いたときは、index.html を返す
    location /features/contract-management/ {
        internal;
        try_files $uri /features/contract-management/index.html;
    }

    # API を同一オリジンにする場合。使わないならこの location は不要。
    # フロントの VITE_API_CONTRACT_MANAGEMENT_URL は https://example.com/portal-contract-management-api にする。
    # 同一オリジンなら、バックエンドの CORS_ORIGINS は不要（Cookie も同一サイトで送られる）。
    # 外部システム（生成AI など）が API キーで呼ぶ場合も、この location を通す（Authorization ヘッダはそのまま渡る）。
    location /portal-contract-management-api/ {
        proxy_pass http://127.0.0.1:8012/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
