# api-key-management のフロント配置例（rules/17-nginx-deploy.md）
# dist の中身をドキュメントルートの features/api-key-management/ へコピーする。

location = /portal_api_key_management {
    return 301 /portal_api_key_management/;
}

location /portal_api_key_management/ {
    rewrite ^/portal_api_key_management/(.*)$ /features/api-key-management/$1 last;
}

location /features/api-key-management/ {
    internal;
    try_files $uri /features/api-key-management/index.html;
}

# 対象機能（goods / expense / knowhow / schedule）の API を nginx 経由で公開するとき、
# Authorization ヘッダは既定でバックエンドへ渡る。proxy_set_header Authorization "" などで消さないこと。
