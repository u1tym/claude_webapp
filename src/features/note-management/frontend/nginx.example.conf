# note-management フロントの配置例。
# 公開 URL は /portal_note_management/ 。Vite base も同じ。
# dist の中身はドキュメントルートの features/note-management/ に置く。
#
#   ドキュメントルート/features/note-management/index.html
#   ドキュメントルート/features/note-management/assets/...
#
# rewrite は last（break ではない）。

server {
    listen 80;
    server_name example.com;

    root /var/www/html;

    location = /portal_note_management {
        return 301 /portal_note_management/;
    }

    location /portal_note_management/ {
        rewrite ^/portal_note_management/(.*)$ /features/note-management/$1 last;
    }

    location /features/note-management/ {
        internal;
        try_files $uri /features/note-management/index.html;
    }

    # API を同一オリジンにする場合。使わないならこの location は不要。
    # フロントの VITE_API_NOTE_MANAGEMENT_URL は https://example.com/portal-note-management-api にする。
    #
    # 画像・バイナリの取得は、<img> やダウンロードのリンクが Cookie を自動で送る。フロントと API は、
    # Cookie が送られる関係（同一サイト）にすること。
    location /portal-note-management-api/ {
        proxy_pass http://127.0.0.1:8009/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 画像・バイナリのアップロード（Base64 で、上限 10 MB の場合に最大 約 14 MB）を通すため、
        # 本文の上限を 16 MB 以上にする。
        client_max_body_size 16m;

        # 画像・バイナリの応答は、バッファリングせずに流す。
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
