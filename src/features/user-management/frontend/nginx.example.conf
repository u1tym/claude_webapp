# user-management フロントの配置例（方針 A）。
# 公開 URL は /portal_user_management/ 。Vite base も同じ。
# dist の中身はドキュメントルートの features/user-management/ に置く。
#
#   ドキュメントルート/features/user-management/index.html
#   ドキュメントルート/features/user-management/assets/...
#
# rewrite は last（break ではない）。break + try_files だと
# 元の $uri を探すため JS/CSS が index.html になる。

server {
    listen 80;
    server_name example.com;

    root /var/www/html;

    location = /portal_user_management {
        return 301 /portal_user_management/;
    }

    location /portal_user_management/ {
        rewrite ^/portal_user_management/(.*)$ /features/user-management/$1 last;
    }

    location /features/user-management/ {
        internal;
        try_files $uri /features/user-management/index.html;
    }

    # API を同一オリジンにする場合。使わないならこの location は不要。
    # フロントの VITE_API_USER_MANAGEMENT_URL は https://example.com/portal-user-management-api にする。
    location /portal-user-management-api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
