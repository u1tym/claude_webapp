# portal フロントの配置例。
# dist の中身をドキュメントルートの portal/ にコピーする（portal/login/ には置かない）。
#
#   ドキュメントルート/portal/index.html
#   ドキュメントルート/portal/assets/...

server {
    listen 80;
    server_name example.com;

    root /var/www/html;

    location = /portal {
        return 301 /portal/;
    }

    location /portal/ {
        try_files $uri /portal/index.html;
    }

    # API を同一オリジンにする場合。使わないならこの location は不要。
    # フロントの VITE_API_PORTAL_URL は https://example.com/portal-api にする。
    location /portal-api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
