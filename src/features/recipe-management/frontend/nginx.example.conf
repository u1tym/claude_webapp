# recipe-management フロントの配置例。
# 公開 URL は /portal_recipe_management/ 。Vite base も同じ。
# dist の中身はドキュメントルートの features/recipe-management/ に置く。
#
#   ドキュメントルート/features/recipe-management/index.html
#   ドキュメントルート/features/recipe-management/assets/...
#
# rewrite は last（break ではない）。

server {
    listen 80;
    server_name example.com;

    root /var/www/html;

    location = /portal_recipe_management {
        return 301 /portal_recipe_management/;
    }

    location /portal_recipe_management/ {
        rewrite ^/portal_recipe_management/(.*)$ /features/recipe-management/$1 last;
    }

    location /features/recipe-management/ {
        internal;
        try_files $uri /features/recipe-management/index.html;
    }

    # API を同一オリジンにする場合。使わないならこの location は不要。
    # フロントの VITE_API_RECIPE_MANAGEMENT_URL は https://example.com/portal-recipe-management-api にする。
    location /portal-recipe-management-api/ {
        proxy_pass http://127.0.0.1:8008/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
