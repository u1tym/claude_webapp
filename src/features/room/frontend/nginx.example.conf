# room フロントの配置例（rules/17-nginx-deploy.md）。
# 公開 URL は /portal_room/ 。Vite base も同じ。
# dist の中身はドキュメントルートの features/room/ に置く。
#
#   ドキュメントルート/features/room/index.html
#   ドキュメントルート/features/room/assets/...
#
# rewrite は last（break ではない）。break と try_files を同じ location に置かない
# （JS/CSS が HTML になる）。$uri/ は使わない。
#
# 注意: スラッシュなしの /portal_room への 301 は、クエリを引き継がない。
# ポータルのメニューが付けるキャッシュ回避のクエリ（?a=…）は、遷移先の URL が
# 末尾スラッシュなしだと消える。機能マスタの遷移先 URL は、末尾に / を付けた
# 公開 URL（例: https://<ホスト>/portal_room/）にする。

server {
    listen 80;
    server_name example.com;

    root /var/www/html;

    location = /portal_room {
        return 301 /portal_room/;
    }

    location /portal_room/ {
        rewrite ^/portal_room/(.*)$ /features/room/$1 last;
    }

    # 画面（/portal_room/schedules など）を直接開いたときは、index.html を返す
    location /features/room/ {
        internal;
        try_files $uri /features/room/index.html;
    }

    # API を同一オリジンにする場合。使わないならこの location は不要。
    # フロントの VITE_API_ROOM_URL は https://example.com/portal-room-api にする。
    # 同一オリジンなら、バックエンドの CORS_ORIGINS は不要（Cookie も同一サイトで送られる）。
    location /portal-room-api/ {
        proxy_pass http://127.0.0.1:8011/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
