# knowhow-management フロントの配置例。
# 公開 URL は /portal_knowhow_management/ 。Vite base も同じ。
# dist の中身はドキュメントルートの features/knowhow-management/ に置く。
#
#   ドキュメントルート/features/knowhow-management/index.html
#   ドキュメントルート/features/knowhow-management/assets/...
#
# rewrite は last（break ではない）。

server {
    listen 80;
    server_name example.com;

    root /var/www/html;

    location = /portal_knowhow_management {
        return 301 /portal_knowhow_management/;
    }

    location /portal_knowhow_management/ {
        rewrite ^/portal_knowhow_management/(.*)$ /features/knowhow-management/$1 last;
    }

    location /features/knowhow-management/ {
        internal;
        try_files $uri /features/knowhow-management/index.html;
    }

    # API を同一オリジンにする場合。使わないならこの location は不要。
    # フロントの VITE_API_KNOWHOW_MANAGEMENT_URL は https://example.com/portal-knowhow-management-api にする。
    location /portal-knowhow-management-api/ {
        proxy_pass http://127.0.0.1:8005/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
